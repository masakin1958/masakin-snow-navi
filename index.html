<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 鳥取東部雪道ナビ</title>
<style>
    body{font-family:"Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; padding:15px; max-width:1000px; margin:auto; background:#f0f2f5;}
    h1{font-size:20px; text-align:center; color:#1e3a8a; margin-bottom: 5px;}
    
    /* 天気予報エリアのスタイル */
    .weather-section {
        background: white;
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
    }
    .current-time {
        font-size: 14px;
        color: #555;
        margin-bottom: 10px;
        font-weight: bold;
    }

    /* テーブルのスタイル */
    table{width:100%; border-collapse:collapse; background:white; font-size:12px; box-shadow:0 4px 15px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden;}
    th,td{border-bottom:1px solid #dee2e6; padding:10px 8px; text-align:left; vertical-align: middle;}
    th{background:#1e40af; color:white; font-weight:normal;}
    tr:nth-child(even) {background-color: #f8f9fa;}
    
    .val-snow { font-weight:bold; font-size: 14px; }
    .val-temp { font-size: 14px; }
    
    /* デバッグ表示（必要なければ display:none にしてください） */
    .debug-text{color:#999; font-family:monospace; font-size:10px; display:block; max-width:200px; white-space:pre-wrap; line-height: 1.1;}

    .btn-update{background:#1d4ed8; color:white; border:none; padding:12px; border-radius:30px; cursor:pointer; width:100%; margin:10px 0; font-weight:bold; font-size:14px; transition: background 0.3s;}
    .btn-update:hover{background:#1e3a8a;}
</style>
</head>
<body>

<h1>🚗 鳥取東部雪道ナビ</h1>

<div class="weather-section">
    <div id="headerDate" class="current-time">データ取得中...</div>
    
    <a class="weatherwidget-io" href="https://forecast7.com/ja/35d50134d24/tottori/" data-label_1="鳥取市" data-label_2="今後の天気" data-theme="pure" >鳥取市 今後の天気</a>
    <script>
    !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
    </script>
</div>

<button class="btn-update" onclick="refreshData()">🔄 最新データに更新</button>

<table>
    <thead>
        <tr>
            <th style="width:35%">地点名</th>
            <th style="width:15%">積雪</th>
            <th style="width:15%">温度</th>
            <th style="width:35%">元データ(確認用)</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
// CSVに基づいて更新した地点リスト
const pointsMaster = [
    {id: "159", search: "鳥取市東品治町【鳥取駅前】", name: "鳥取駅前"},
    {id: "249", search: "鳥取市北園", name: "鳥取市北園"},
    {id: "161", search: "鳥取市海蔵寺【環境大入口】", name: "環境大入口(海蔵寺)"},
    {id: "162", search: "鳥取市湖山町北【鳥取商業高前】", name: "鳥取商業高前"},
    {id: "250", search: "鳥取市細見", name: "鳥取市細見"},
    {id: "164", search: "国府町新町【鳥取盲学校前】", name: "国府町新町"},
    {id: "261", search: "鳥取市商栄町～南隈【国道9号立体交差】", name: "南隈【国道9号立体交差】"},
    {id: "167", search: "福部町海士【海士交差点】", name: "福部町海士【海士交差点】"},
    {id: "129", search: "鳥取市越路", name: "八頭町船岡(越路)"},
    {id: "064", search: "鳥取市高路", name: "倉田(鳥取市高路)"},
    {id: "039", search: "佐治町栃原【辰巳峠】", name: "佐治町栃原【辰巳峠】"},
    {id: "133", search: "青谷町絹見", name: "青谷IC周辺"},
    {id: "002", search: "鹿野町河内", name: "鹿野町河内"},
    {id: "163", search: "河原町河原", name: "河原町河原"},
    {id: "130", search: "鳥取市洞谷", name: "鳥取市洞谷"},
    {id: "160", search: "鳥取市徳尾【嶋入口交差点】", name: "鳥取市徳尾【嶋入口交差点】"},
    {id: "001", search: "鳥取市岩坪", name: "鳥取市岩坪"},
    {id: "157", search: "気高町下光元", name: "気高町下光元"},
    {id: "152", search: "岩美町浦富【岩美IC付近】", name: "岩美町浦富【岩美IC付近】"},
    {id: "165", search: "福部町湯山【鳥取砂丘入口】", name: "湯山(砂丘入口)"},
    {id: "154", search: "鳥取市百谷【百谷ダム入口】", name: "百谷ダム入口"},
    {id: "172", search: "鳥取市正蓮寺【正蓮寺交差点】", name: "正蓮寺交差点"},
    {id: "257", search: "鳥取市千代水【千代水4丁目周辺】", name: "鳥取市千代水【千代水4丁目周辺】"},
    {id: "260", search: "鳥取市白兎【JR立体交差南側】", name: "鳥取市白兎【JR立体交差南側】"},
    {id: "264", search: "鳥取市吉方町", name: "鳥取市吉方町"},
    {id: "103", search: "用瀬町江波", name: "用瀬町江波"}
];

async function refreshData() {
    const tbody = document.getElementById('tableBody');
    const headerDate = document.getElementById('headerDate');
    
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px;">データを読み込んでいます...</td></tr>';
    
    try {
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://tori-bousai.jp/yukinavi/tobu/'));
        const html = await response.text();
        
        // HTML整形
        let formattedText = html.replace(/<\/(tr|div|p|li|dd)>/gi, '\n').replace(/<br\s*\/?>/gi, '\n');
        formattedText = formattedText.replace(/<[^>]+>/g, '');
        const lines = formattedText.split('\n').map(line => line.trim()).filter(line => line.length > 0);

        tbody.innerHTML = '';
        
        // 最新の更新日時取得
        let dataTime = "日時不明";
        for(let i=0; i<10; i++) {
            if(lines[i] && lines[i].match(/\d{4}\/\d{2}\/\d{2}/)) {
                dataTime = lines[i];
                break;
            }
        }
        headerDate.innerHTML = `📅 道路データ取得日時：${dataTime}`;

        pointsMaster.forEach(p => {
            let snowStr = "--";
            let tempStr = "--";
            let debugLog = ""; 

            // 1. 地点名検索
            const nameIndex = lines.findIndex(line => line.includes(p.search));

            if (nameIndex !== -1) {
                // 2. 日時行検索
                let dateIndex = -1;
                for (let i = nameIndex; i < Math.min(nameIndex + 15, lines.length); i++) {
                    if (lines[i].includes("観測日時")) {
                        dateIndex = i;
                        break;
                    }
                }

                if (dateIndex !== -1) {
                    const chunk = lines.slice(dateIndex, dateIndex + 8);
                    debugLog = chunk.join('\n'); 

                    for (let k = 0; k < chunk.length; k++) {
                        if (chunk[k].includes("路上温度")) {
                            if (chunk[k+1]) tempStr = chunk[k+1]; 
                        }
                        if (chunk[k].includes("路上積雪深")) {
                            if (chunk[k+1]) snowStr = chunk[k+1]; 
                        }
                    }
                } else {
                    debugLog = "日時データなし";
                }
            } else {
                debugLog = "地点名が見つかりません";
            }

            // 表に行を追加
            const row = tbody.insertRow();
            
            // 積雪アラート色（数値があれば赤）
            let snowColor = "black";
            if (snowStr !== "--" && !snowStr.startsWith("0cm") && !snowStr.startsWith("0.0")) {
                snowColor = "#d32f2f"; // 赤
            }

            row.innerHTML = `
                <td><a href="https://yukinavi.net/i/data/${p.id}/index.html" target="_blank" style="text-decoration:none; color:#1d4ed8; font-weight:bold;">${p.name}</a></td>
                <td class="val-snow" style="color:${snowColor}">${snowStr}</td>
                <td class="val-temp">${tempStr}</td>
                <td><span class="debug-text">${debugLog.substring(0, 40)}${debugLog.length>40?'...':''}</span></td>
            `;
        });

    } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="4" style="color:red; text-align:center;">エラー：データの取得に失敗しました</td></tr>';
    }
}

refreshData();
</script>

</body>
</html>
