<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳥取東部雪道ナビ (修正版)</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f9; margin: 0; padding: 10px; color: #333; }
        h1 { text-align: center; color: #004a99; font-size: 1.4rem; margin-bottom: 15px; }
        .update-info { text-align: right; font-size: 0.8rem; color: #666; margin-bottom: 10px; }
        .group-box { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; border: 1px solid #d1d9e0; }
        .group-header { background: #004a99; color: #fff; padding: 10px 15px; font-weight: bold; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #eee; text-align: center; }
        th { background: #f8f9fa; font-size: 0.8rem; color: #555; }
        .name-td { text-align: left; font-weight: bold; width: 30%; }
        .snow-td { color: #007bff; font-weight: bold; font-size: 1.1rem; }
        .temp-td { color: #d9534f; }
        .note-td { text-align: left; font-size: 0.8rem; color: #777; width: 35%; }
        .highlight { background-color: #fff9c4; }
        .footer { text-align: center; margin: 20px 0; font-size: 0.9rem; line-height: 2; }
        .footer a { color: #004a99; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🚗 鳥取東部雪道ナビ</h1>
    <div id="last-update" class="update-info">最新データを読み込み中...</div>

    <div id="content-area">
        </div>

    <div class="footer">
        <hr>
        <a href="https://tori-bousai.jp/yukinavi/" target="_blank">▷ 鳥取ゆきみちナビ（詳細情報）</a><br>
        <a href="https://forecast7.com/ja/35d50134d24/tottori/" target="_blank">▷ 鳥取市の天気予報</a>
    </div>

<script>
/**
 * 【ここが重要】データの取得先
 * 元のサイトが自分のフォルダのデータを読み込んでいた場合は、このままで動くはずです。
 */
const DATA_URL = "snow_data.json"; 

const CONFIG = [
    {
        title: "① 主要峠（県境）",
        points: [
            { id: "101", name: "辰巳峠", note: "岡山県境。急坂注意" },
            { id: "201", name: "戸倉峠", note: "兵庫県境。トンネル前注意" },
            { id: "301", name: "志戸坂峠", note: "岡山方面。凍結多し" }
        ]
    },
    {
        title: "② 国道29号（若桜方面）",
        points: [
            { id: "202", name: "若桜", note: "市街地より雪深くなります" },
            { id: "203", name: "丹比", note: "" }
        ]
    },
    {
        title: "③ 国道53号（智頭方面）",
        points: [
            { id: "302", name: "智頭", note: "冷え込みに注意" },
            { id: "303", name: "用瀬", note: "橋の上の凍結に注意" }
        ]
    },
    {
        title: "④ 国道9号（岩美方面）",
        points: [
            { id: "401", name: "蒲生峠", note: "カーブが多い山道" },
            { id: "402", name: "福部", note: "風が強い場合があります" }
        ]
    },
    {
        title: "⑤ 鳥取市街・近郊",
        points: [
            { id: "501", name: "鳥取市役所付近", note: "交通量多し。足元注意" },
            { id: "502", name: "河原", note: "" }
        ]
    }
];

async function fetchAndRender() {
    try {
        // データを取得
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error('Network response was not ok');
        const dataList = await response.json(); 
        
        render(dataList);
        document.getElementById('last-update').innerText = "最終更新: " + new Date().toLocaleTimeString();
    } catch (error) {
        console.error("エラー:", error);
        document.getElementById('last-update').innerHTML = 
            "<span style='color:red;'>データの読み込みに失敗しました。</span><br>元のURL設定を確認してください。";
    }
}

function render(apiData) {
    const area = document.getElementById('content-area');
    area.innerHTML = "";

    CONFIG.forEach(group => {
        let rows = "";
        group.points.forEach(p => {
            const liveData = apiData.find(d => d.id == p.id) || { snow: "-", temp: "-" };
            const rowClass = (liveData.snow > 0 && liveData.snow !== "-") ? "highlight" : "";
            
            rows += `
                <tr class="${rowClass}">
                    <td class="name-td">${p.name}</td>
                    <td class="snow-td">${liveData.snow}<small>cm</small></td>
                    <td class="temp-td">${liveData.temp}<small>℃</small></td>
                    <td class="note-td">${p.note}</td>
                </tr>
            `;
        });

        area.innerHTML += `
            <div class="group-box">
                <div class="group-header">${group.title}</div>
                <table>
                    <thead><tr><th>地点</th><th>積雪</th><th>気温</th><th>備考</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;
    });
}

fetchAndRender();
setInterval(fetchAndRender, 600000);
</script>
</body>
</html>
