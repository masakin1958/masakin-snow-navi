body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px;max-width:800px;margin:auto;background:#f8f9fa}

.link{color:#1976d2;font-size:16px;font-weight:600;text-decoration:none;display:inline-block;padding:10px 20px;border-radius:25px;background:#bbdefb;transition:all 0.3s}
.link:hover{background:#90caf9}
.status{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0;padding:15px;border-radius:12px;background:linear-gradient(135deg,#3b82f6 0%,#1e40af 100%);color:white}

table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
th,td{border:1px solid #dee2e6;padding:10px;text-align:left}
th{background:#e3f2fd;color:#1e3a8a;position:sticky;top:0}

.loading{text-align:center;padding:30px!important;color:#856404;background:#fff3cd}

</head>
<body>

<div class="link-box">
<a href="https://tori-bousai.jp/yukinavi/" class="link" target="_blank">📋鳥取ゆきみちナビ（本家）</a>

<div class="status" id="status">
    <div class="status-item"><div class="status-num" id="totalPoints">-</div><div class="status-label">監視地点</div></div>
    <div class="status-item"><div class="status-num" id="snowStatus">-</div><div class="status-label">積雪状況</div></div>
    <div class="status-item"><div class="status-num" id="avgTemp">-</div><div class="status-label">平均気温</div></div>
    <div class="status-item"><div class="status-num" id="maxSnow">-</div><div class="status-label">最大積雪</div></div>
</div>

<p class="updated">更新: <span id="updated">--</span> | <button class="btn-update" onclick="refreshData()">🔄 最新情報取得</button></p>

<table id="snowTable">

    <tbody id="tableBody"><tr><td colspan="3" class="loading">データ取得中...</td></tr></tbody>

    {name: "鳥取市吉方町", url: "data/264/index.html", s: "吉方"},
    {name: "鳥取市秋里～幸町", url: "data/265/index.html", s: "秋里"},
    {name: "鳥取市北園", url: "data/249/index.html", s: "北園"},
    {name: "鳥取市細見", url: "data/250/index.html", s: "細見"}
];

const DATA_SOURCE = "https://tori-bousai.jp/yukinavi/tobu/";
const LINK_BASE = "https://yukinavi.net/i/";

function updateStatus(snowData) {
    const snows = snowData.map(d => parseFloat(d.snow) || 0);
    const temps = snowData.map(d => parseFloat(d.temp)).filter(n => !isNaN(n));
    const avgTemp = temps.length ? temps.reduce((a,b)=>a+b,0)/temps.length : 0;
    const maxSnow = Math.max(...snows, 0);
    const snowStatus = maxSnow === 0 ? '🚗路面良好' : maxSnow < 5 ? '⚠️注意' : '🚨大雪';
    
    document.getElementById('totalPoints').textContent = snowData.length;
    document.getElementById('snowStatus').textContent = snowStatus;
    document.getElementById('avgTemp').textContent = avgTemp.toFixed(1);
    document.getElementById('maxSnow').textContent = maxSnow.toFixed(1);
}

async function refreshData() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="3" class="loading">最新データを解析中...</td></tr>';
    
    try {
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(DATA_SOURCE);
        const response = await fetch(proxyUrl);
        const html = await response.text();
        
        const snowData = [];
        tbody.innerHTML = '';
        
        pointsData.forEach(p => {
            // 気温と積雪を抽出（改行・タグをまたいで検索）
            const escaped = p.s.replace(/[()～]/g, '\\$&');
            const snowMatch = html.match(new RegExp(escaped + '[\\s\\S]*?([0-9.]+?)\\s*cm', 'i'));
            const tempMatch = html.match(new RegExp(escaped + '[\\s\\S]*?([−-ー]?\\s*[0-9.]+?)\\s*℃', 'i'));
            
            const snow = snowMatch ? snowMatch[1] : '0.0';
            let temp = tempMatch ? tempMatch[1].replace(/[−ー]/g, '-').trim() : '--';
            
            snowData.push({point: p.name, snow, temp});
            
            const row = tbody.insertRow();
            const snowColor = parseFloat(snow) > 0 ? '#f59e0b' : '#10b981';
            row.innerHTML = `
                <td><a href="${LINK_BASE}${p.url}" target="_blank" class="point-link">${p.name}</a></td>
                <td style="color:${snowColor}; font-weight:bold">${snow}</td>
                <td>${temp}</td>
            `;
        });
        updateStatus(snowData);
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="3" class="loading" style="color:red">通信エラー。再読み込みしてください。</td></tr>';
    }
    document.getElementById('updated').textContent = new Date().toLocaleString('ja-JP');
}

refreshData();
setInterval(refreshData, 5 * 60 * 1000); // 5分自動更新
</script>

</html>
