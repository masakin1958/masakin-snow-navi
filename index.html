<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 鳥取東部雪道ナビ</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:15px;max-width:800px;margin:auto;background:#f8f9fa}
h1{font-size:22px;margin:10px 0;color:#1e3a8a;text-align:center;font-weight:700}
.link-box{background:#e3f2fd;border-radius:12px;padding:15px;margin:10px 0;text-align:center}
.link{color:#1976d2;font-size:15px;font-weight:600;text-decoration:none}
.status{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;padding:15px;border-radius:12px;background:linear-gradient(135deg,#3b82f6 0%,#1e40af 100%);color:white}
.status-item{text-align:center;flex:1;min-width:80px}
.status-num{font-size:20px;font-weight:700}
.status-label{font-size:10px;opacity:0.9}
.updated{font-size:13px;color:#6c757d;text-align:center;margin:10px 0}
.btn-update{background:#1d4ed8;color:white;border:none;padding:8px 18px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;background:white;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
th,td{border:1px solid #dee2e6;padding:10px;text-align:left}
th{background:#e3f2fd;color:#1e3a8a}
.point-link{color:#1976d2;text-decoration:none;font-weight:bold}
@media(max-width:600px){table{font-size:11px}th,td{padding:8px}}
</style>
</head>
<body>
<h1>🚗 鳥取東部雪道ナビ</h1>

<div class="link-box">
<a href="https://tori-bousai.jp/yukinavi/" class="link" target="_blank">📋本家サイト（詳細確認）</a>
</div>

<div class="status">
    <div class="status-item"><div class="status-num" id="totalPoints">0</div><div class="status-label">監視地点</div></div>
    <div class="status-item"><div class="status-num" id="snowStatus">-</div><div class="status-label">路面状況</div></div>
    <div class="status-item"><div class="status-num" id="avgTemp">-</div><div class="status-label">平均気温</div></div>
    <div class="status-item"><div class="status-num" id="maxSnow">-</div><div class="status-label">最大積雪</div></div>
</div>

<p class="updated">更新: <span id="updated">--</span> | <button class="btn-update" onclick="refreshData()">🔄 最新情報に更新</button></p>

<table id="snowTable">
    <thead><tr><th>地点名</th><th>積雪(cm)</th><th>路上温(℃)</th></tr></thead>
    <tbody id="tableBody"><tr><td colspan="3" style="text-align:center;padding:20px;">取得中...</td></tr></tbody>
</table>

<script>
const pointsMaster = [
    {id: "159", name: "鳥取市東品治町【鳥取駅前】"},
    {id: "249", name: "鳥取市北園"},
    {id: "161", name: "鳥取市海蔵寺【環境大入口】"},
    {id: "162", name: "鳥取市湖山町北【鳥取商業高前】"},
    {id: "250", name: "鳥取市細見"},
    {id: "164", name: "国府町新町【鳥取盲学校前】"},
    {id: "261", name: "鳥取市商栄町～南隈【国道9号立体交差】"},
    {id: "167", name: "福部町海士【海士交差点】"},
    {id: "129", name: "鳥取市越路"},
    {id: "064", name: "鳥取市高路"},
    {id: "039", name: "佐治町栃原【辰巳峠】"},
    {id: "133", name: "青谷町絹見"},
    {id: "002", name: "鹿野町河内"},
    {id: "163", name: "河原町河原"},
    {id: "130", name: "鳥取市洞谷"},
    {id: "160", name: "鳥取市徳尾【嶋入口交差点】"},
    {id: "001", name: "鳥取市岩坪"},
    {id: "157", name: "気高町下光元"},
    {id: "152", name: "岩美町浦富【岩美IC付近】"},
    {id: "165", name: "福部町湯山【鳥取砂丘入口】"},
    {id: "154", name: "鳥取市百谷【百谷ダム入口】"},
    {id: "172", name: "鳥取市正蓮寺【正蓮寺交差点】"},
    {id: "257", name: "鳥取市千代水【千代水4丁目周辺】"},
    {id: "260", name: "鳥取市白兎【JR立体交差南側】"},
    {id: "264", name: "鳥取市吉方町"},
    {id: "103", name: "用瀬町江波"}
];

async function refreshData() {
    try {
        // 安全なHTTPS対応のデータソースから取得
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://tori-bousai.jp/yukinavi/tobu/'));
        const html = await response.text();
        
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let snowData = [];

        pointsMaster.forEach(p => {
            // 地点番号(ID)を基準に、その地点の情報をHTMLから分離して解析
            const section = html.split('data/' + p.id + '/')[1];
            if (!section) return;
            const block = section.substring(0, 500);

            const snowMatch = block.match(/路上積雪深\s*([\d.]+)?\s*cm/);
            const tempMatch = block.match(/路上温度\s*([−-ー]?\s*[\d.]+)?\s*℃/);

            const snow = (snowMatch && snowMatch[1]) ? snowMatch[1] : "0.0";
            let temp = (tempMatch && tempMatch[1]) ? tempMatch[1].replace(/[−ー]/g, '-').trim() : "--";

            snowData.push({snow, temp});

            const row = tbody.insertRow();
            const snowVal = parseFloat(snow) || 0;
            row.innerHTML = `
                <td><a href="https://yukinavi.net/i/data/${p.id}/index.html" target="_blank" class="point-link">${p.name}</a></td>
                <td style="color:${snowVal > 0 ? '#f59e0b' : '#10b981'}; font-weight:bold">${snow}</td>
                <td>${temp}</td>
            `;
        });

        updateStatus(snowData);
        document.getElementById('updated').textContent = new Date().toLocaleString('ja-JP');
    } catch (e) {
        console.error(e);
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" style="text-align:center;color:red;">データ取得に失敗しました</td></tr>';
    }
}

function updateStatus(sd) {
    const s = sd.map(d=>parseFloat(d.snow)).filter(n=>!isNaN(n));
    const t = sd.map(d=>parseFloat(d.temp)).filter(n=>!isNaN(n));
    document.getElementById('totalPoints').textContent = sd.length;
    document.getElementById('snowStatus').textContent = Math.max(...s, 0) === 0 ? '🚗良好' : '⚠️注意';
    document.getElementById('avgTemp').textContent = t.length ? (t.reduce((a,b)=>a+b,0)/t.length).toFixed(1) : '--';
    document.getElementById('maxSnow').textContent = s.length ? Math.max(...s).toFixed(1) : '0.0';
}

refreshData();
setInterval(refreshData, 10 * 60 * 1000);
</script>
</body>
</html>
