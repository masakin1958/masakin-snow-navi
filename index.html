<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 鳥取東部雪道ナビ (検証モード)</title>
<style>
body{font-family:sans-serif;padding:15px;max-width:1000px;margin:auto;background:#f8f9fa}
h1{font-size:22px;text-align:center;color:#1e3a8a}
.status{display:flex;gap:8px;margin:10px 0;padding:15px;border-radius:12px;background:#1e40af;color:white;text-align:center}
.status-item{flex:1}.status-num{font-size:20px;font-weight:bold}
table{width:100%;border-collapse:collapse;background:white;font-size:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
th,td{border:1px solid #dee2e6;padding:8px;text-align:left}
th{background:#e3f2fd}
.debug-text{color:#666;font-family:monospace;font-size:10px;background:#f0f0f0;display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-update{background:#1d4ed8;color:white;border:none;padding:10px;border-radius:20px;cursor:pointer;width:100%;margin:10px 0}
</style>
</head>
<body>
<h1>🚗 鳥取東部雪道ナビ (検証モード)</h1>

<div class="status">
    <div class="status-item"><div class="status-num" id="totalPoints">0</div>監視地点</div>
    <div class="status-item"><div class="status-num" id="avgTemp">--</div>平均気温</div>
    <div class="status-item"><div class="status-num" id="maxSnow">0.0</div>最大積雪</div>
</div>

<button class="btn-update" onclick="refreshData()">🔄 データを更新して解析元を確認</button>
<p style="font-size:12px;text-align:center">更新: <span id="updated">--</span></p>

<table>
    <thead>
        <tr>
            <th>地点名</th>
            <th>積雪(cm)</th>
            <th>温度(℃)</th>
            <th>解析元テキスト (4列目)</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
const pointsMaster = [
    {id: "159", search: "鳥取駅前", name: "鳥取駅前(東品治町)"},
    {id: "249", search: "鳥取市北園", name: "北園"},
    {id: "161", search: "環境大入口", name: "海蔵寺(環境大入口)"},
    {id: "162", search: "鳥取商業高前", name: "湖山町北(鳥商前)"},
    {id: "250", search: "鳥取市細見", name: "細見"},
    {id: "164", search: "盲学校前", name: "国府町新町(盲学校前)"},
    {id: "261", search: "南隈", name: "南隈(国道9号)"},
    {id: "167", search: "海士交差点", name: "海士交差点"},
    {id: "129", search: "越路", name: "越路"},
    {id: "064", search: "高路", name: "高路"},
    {id: "039", search: "辰巳峠", name: "辰巳峠"},
    {id: "133", search: "絹見", name: "青谷IC周辺"},
    {id: "002", search: "鹿野町河内", name: "鹿野町河内"},
    {id: "163", search: "河原町河原", name: "河原町河原"},
    {id: "130", search: "洞谷", name: "洞谷"},
    {id: "160", search: "嶋入口", name: "徳尾(嶋入口)"},
    {id: "001", search: "岩坪", name: "岩坪"},
    {id: "157", search: "下光元", name: "下光元"},
    {id: "152", search: "岩美IC付近", name: "岩美IC付近"},
    {id: "165", search: "砂丘入口", name: "砂丘入口"},
    {id: "154", search: "百谷ダム", name: "百谷ダム入口"},
    {id: "172", search: "正蓮寺", name: "正蓮寺交差点"},
    {id: "257", search: "千代水", name: "千代水"},
    {id: "260", search: "白兎", name: "白兎"},
    {id: "264", search: "吉方町", name: "吉方町"},
    {id: "103", search: "江波", name: "用瀬町江波"}
];

async function refreshData() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="4">解析中...</td></tr>';
    
    try {
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('https://tori-bousai.jp/yukinavi/tobu/'));
        const html = await response.text();
        // 解析をしやすくするため、タグをスペースに変えて短く整理
        const cleanText = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
        
        tbody.innerHTML = '';
        let results = [];

        pointsMaster.forEach(p => {
            const idx = cleanText.indexOf(p.search);
            let snow = "0.0", temp = "--", snippet = "見つかりません";

            if (idx !== -1) {
                // 地点名の後ろ300文字を抽出
                snippet = cleanText.substring(idx, idx + 300);
                const sM = snippet.match(/路上積雪深\s*([\d.]+)/);
                const tM = snippet.match(/路上温度\s*([−-ー]?[\d.]+)/);
                if(sM) snow = sM[1];
                if(tM) temp = tM[1].replace(/[−ー]/g, '-');
            }

            results.push({snow, temp});
            const row = tbody.insertRow();
            row.innerHTML = `
                <td>${p.name}</td>
                <td style="font-weight:bold; color:${parseFloat(snow)>0?'orange':'green'}">${snow}</td>
                <td>${temp}</td>
                <td><span class="debug-text">${snippet}</span></td>
            `;
        });

        // 統計更新
        document.getElementById('totalPoints').textContent = results.length;
        const sList = results.map(r=>parseFloat(r.snow)||0);
        document.getElementById('maxSnow').textContent = Math.max(...sList).toFixed(1);
        document.getElementById('updated').textContent = new Date().toLocaleTimeString();
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4">エラー発生</td></tr>';
    }
}
refreshData();
</script>
</body>
</html>
