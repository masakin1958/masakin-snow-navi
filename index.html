<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚗 鳥取東部雪道ナビ</title>
<style>
    body{font-family:"Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; padding:15px; max-width:1000px; margin:auto; background:#f0f2f5;}
    h1{font-size:20px; text-align:center; color:#1e3a8a; margin-bottom: 5px;}
    
    /* 天気予報エリア */
    .weather-section {
        background: white;
        border-radius: 12px;
        padding: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
    }
    .current-time {
        font-size: 14px;
        color: #555;
        margin-bottom: 10px;
        font-weight: bold;
    }

    /* リンクボタン */
    .link-box { margin: 20px 0; text-align: center; }
    .link {
        display: block;
        background: #1d4ed8;
        color: white;
        text-decoration: none;
        padding: 15px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 16px;
        transition: background 0.3s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .link:hover { background: #1e3a8a; }

    /* テーブル */
    table{width:100%; border-collapse:collapse; background:white; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.05); border-radius: 8px; overflow: hidden;}
    th,td{border-bottom:1px solid #dee2e6; padding:12px 8px; text-align:left; vertical-align: middle;}
    th{background:#1e40af; color:white; font-weight:normal;}
    tr:nth-child(even) {background-color: #f8f9fa;}
    
    .val-snow { font-weight:bold; font-size: 15px; }
    .val-temp { font-size: 15px; }
</style>
</head>
<body>

<h1>🚗 鳥取東部雪道ナビ</h1>

<div class="weather-section">
    <div id="headerDate" class="current-time">データ取得中...</div>
    
    <a class="weatherwidget-io" href="https://forecast7.com/ja/35d50134d24/tottori/" data-label_1="鳥取市" data-label_2="今後の天気" data-theme="pure" >鳥取市 今後の天気</a>
    <script>
    !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
    </script>
</div>

<div class="link-box">
    <a href="https://tori-bousai.jp/yukinavi/" class="link" target="_blank">🚗 鳥取ゆきみちナビ 詳細情報はこちら</a>
</div>

<table>
    <thead>
        <tr>
            <th style="width:50%">地点名</th>
            <th style="width:25%">積雪</th>
            <th style="width:25%">温度</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
// 監視対象リスト（IDは自動取得するため削除しました）
const pointsMaster = [
    {search: "鳥取市東品治町【鳥取駅前】", name: "鳥取駅前"},
    {search: "鳥取市北園", name: "鳥取市北園"},
    {search: "鳥取市海蔵寺【環境大入口】", name: "環境大入口(海蔵寺)"},
    {search: "鳥取市湖山町北【鳥取商業高前】", name: "鳥取商業高前"},
    {search: "鳥取市細見", name: "鳥取市細見"},
    {search: "国府町新町【鳥取盲学校前】", name: "国府町新町"},
    {search: "鳥取市商栄町～南隈【国道9号立体交差】", name: "南隈【国道9号立体交差】"},
    {search: "福部町海士【海士交差点】", name: "福部町海士【海士交差点】"},
    {search: "鳥取市越路", name: "八頭町船岡(越路)"},
    {search: "鳥取市高路", name: "倉田(鳥取市高路)"},
    {search: "佐治町栃原【辰巳峠】", name: "佐治町栃原【辰巳峠】"},
    {search: "青谷町絹見", name: "青谷IC周辺"},
    {search: "鹿野町河内", name: "鹿野町河内"},
    {search: "河原町河原", name: "河原町河原"},
    {search: "鳥取市洞谷", name: "鳥取市洞谷"},
    {search: "鳥取市徳尾【嶋入口交差点】", name: "鳥取市徳尾【嶋入口交差点】"},
    {search: "鳥取市岩坪", name: "鳥取市岩坪"},
    {search: "気高町下光元", name: "気高町下光元"},
    {search: "岩美町浦富【岩美IC付近】", name: "岩美町浦富【岩美IC付近】"},
    {search: "福部町湯山【鳥取砂丘入口】", name: "湯山(砂丘入口)"},
    {search: "鳥取市百谷【百谷ダム入口】", name: "百谷ダム入口"},
    {search: "鳥取市正蓮寺【正蓮寺交差点】", name: "正蓮寺交差点"},
    {search: "鳥取市千代水【千代水4丁目周辺】", name: "鳥取市千代水【千代水4丁目周辺】"},
    {search: "鳥取市白兎【JR立体交差南側】", name: "鳥取市白兎【JR立体交差南側】"},
    {search: "鳥取市吉方町", name: "鳥取市吉方町"},
    {search: "用瀬町江波", name: "用瀬町江波"}
];

async function refreshData() {
    const tbody = document.getElementById('tableBody');
    const headerDate = document.getElementById('headerDate');
    
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:20px;">最新データを取得中...</td></tr>';
    
    try {
        // キャッシュ対策の時刻パラメータ
        const timestamp = new Date().getTime();
        const targetUrl = 'https://tori-bousai.jp/yukinavi/tobu/?t=' + timestamp;
        
        const response = await fetch('https://corsproxy.io/?' + encodeURIComponent(targetUrl));
        const htmlText = await response.text();
        
        // 【重要】DOMパーサーを使って、Webページとして正しく構造解析する
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, "text/html");

        tbody.innerHTML = '';
        
        // 日付の取得（ページ内の観測日時を探す）
        let dataTime = "日時不明";
        // ページ全体から「観測日時」を含む要素を探す
        const timeElements = doc.querySelectorAll('td, div, p, span');
        for (let el of timeElements) {
            if (el.textContent.includes('観測日時') && el.textContent.match(/\d{4}\/\d{2}\/\d{2}/)) {
                // 余計な空白を除去して日付部分だけ抽出
                const match = el.textContent.match(/(\d{4}\/\d{2}\/\d{2}\s+\d{2}:\d{2})/);
                if (match) {
                    dataTime = match[1];
                    break;
                }
            }
        }
        headerDate.innerHTML = `📅 道路データ取得日時：${dataTime}`;

        // 各地点のデータ処理
        pointsMaster.forEach(p => {
            let snowStr = "--";
            let tempStr = "--";
            let linkUrl = "#"; // デフォルト

            // 1. ページ内のすべてのリンク（aタグ）から、目的の地点名を含むものを探す
            // これにより、正しいID（リンク先）を確実に特定できる
            const links = doc.querySelectorAll('a');
            let targetElement = null;

            for (let a of links) {
                if (a.textContent.includes(p.search)) {
                    // リンクが見つかったら、そのhref属性（URL）を取得
                    const href = a.getAttribute('href');
                    if (href && href.includes('detail.php')) {
                        linkUrl = "https://tori-bousai.jp/yukinavi/tobu/" + href;
                    }
                    targetElement = a;
                    break;
                }
            }

            // 2. データ（積雪・温度）を探す
            if (targetElement) {
                // リンクが見つかった場所から、親要素（枠）を遡ってデータを探す
                // 3階層くらい上まで遡れば、同じボックス内のデータが見つかるはず
                let parent = targetElement.parentElement;
                let foundData = false;
                
                // 親、その親、その親...と5回くらい遡って検索範囲を広げる
                for (let i = 0; i < 5; i++) {
                    if (!parent) break;
                    
                    const text = parent.textContent;
                    // この範囲に「積雪」や「温度」があればデータを抽出
                    if (text.includes("路上温度") || text.includes("路上積雪深")) {
                        
                        // 温度抽出 (例: -2.3℃)
                        const tempMatch = text.match(/路上温度\s*([-\d\.]+)/);
                        if (tempMatch) tempStr = tempMatch[1] + "℃";

                        // 積雪抽出 (例: 0.0cm)
                        const snowMatch = text.match(/路上積雪深\s*([-\d\.]+)/);
                        if (snowMatch) snowStr = snowMatch[1] + "cm";
                        
                        foundData = true;
                        break; // データが見つかったらループ終了
                    }
                    parent = parent.parentElement;
                }
            }

            // 表に行を追加
            const row = tbody.insertRow();
            
            // 積雪アラート色
            let snowColor = "black";
            if (snowStr !== "--" && !snowStr.startsWith("0cm") && !snowStr.startsWith("0.0")) {
                snowColor = "#d32f2f"; 
            }

            row.innerHTML = `
                <td><a href="${linkUrl}" target="_blank" style="text-decoration:none; color:#1d4ed8; font-weight:bold;">${p.name}</a></td>
                <td class="val-snow" style="color:${snowColor}">${snowStr}</td>
                <td class="val-temp">${tempStr}</td>
            `;
        });

    } catch (e) {
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="3" style="color:red; text-align:center;">エラー：データの取得に失敗しました。<br>アクセスが混み合っている可能性があります。</td></tr>';
    }
}

refreshData();
</script>

</body>
</html>
